[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-data-pipeline"
version = "1.0.0"
description = "HW2 mini web-data filtering pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "resiliparse==0.15.2",
    "alt-profanity-check==1.6.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


